# New windows, panes and sessions start in /project/6107991/golikovp. Without
# these lines tmux starts them in the directory the session was created in, and
# if that directory has been deleted, the new shell fails with getcwd errors.
bind c new-window -c /project/6107991/golikovp
bind '"' split-window -c /project/6107991/golikovp
bind % split-window -h -c /project/6107991/golikovp
set -s command-alias[100] 'new=new-session -c /project/6107991/golikovp'
